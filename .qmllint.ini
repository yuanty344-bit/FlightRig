[Warnings]
# App is registered as a runtime singleton instance in main.cpp, so qmllint
# cannot resolve it statically and reports every legitimate App.* access as
# unqualified. Suppress only that known false-positive category; all other
# QML diagnostics remain enabled and fail the lint run.
UnqualifiedAccess=disable

[General]
MaxWarnings=0
DisableDefaultImports=false
